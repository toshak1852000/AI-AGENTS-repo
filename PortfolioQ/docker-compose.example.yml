services:
  postgres:
    image: postgres:15
    container_name: portfolioq_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolioq}
      POSTGRES_USER: ${POSTGRES_USER:-portfolioq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolioq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portfolioq_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_celery_worker
    command: celery -A src.tasks.celery_tasks worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_celery_beat
    command: celery -A src.tasks.celery_tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
