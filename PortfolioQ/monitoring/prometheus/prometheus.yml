global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: portfolioq

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: portfolioq_backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: portfolioq_celery
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    honor_labels: true
