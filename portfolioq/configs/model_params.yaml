# PortfolioQ — Model hyperparameters (reproducible seeds, CV, tuning bounds)
# Used by training pipeline and MLflow logging

global:
  random_state: 42
  n_jobs: -1

factor_model:
  ridge:
    alpha: 0.1
    fit_intercept: true
    solver: "auto"
  scaler: "standard"  # StandardScaler

risk_model:
  xgboost:
    max_depth: 5
    learning_rate: 0.05
    n_estimators: 200
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    eval_metric: "mlogloss"
    use_label_encoder: false
  random_forest:
    n_estimators: 200
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
  lightgbm:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
  cv:
    n_splits: 5
    shuffle: true
    random_state: 42
  tuning_optuna:
    n_trials: 30
    timeout_seconds: 600

opportunity_model:
  isolation_forest:
    n_estimators: 200
    contamination: 0.08
    max_features: 1.0
    bootstrap: false

evaluation:
  cv_splits: 5
  time_series_splits: 5  # for factor/forecasting
  stratified: true  # for risk classification
