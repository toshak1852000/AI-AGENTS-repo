[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolioq"
version = "0.1.0"
description = "Autonomous Market & Portfolio Scenario Analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.45",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.13.2",
    "redis>=7.1.0",
    "celery>=5.6.0",
    "pandas>=2.3.3",
    "numpy>=2.0.2",
    "yfinance>=0.2.50",
    "alpha-vantage>=2.3.1",
    "langgraph>=1.0.5",
    "langchain>=1.2.0",
    "reportlab>=4.4.7",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.basedpyright]
reportMissingModuleSource = false
pythonVersion = "3.11"
