apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Password must match POSTGRES_PASSWORD in .env (Grafana expands ${VAR} at startup)
  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: portfolioq
    user: portfolioq
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-portfolioq_secure_2025}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
