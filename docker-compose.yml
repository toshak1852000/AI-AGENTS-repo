services:
  postgres:
    image: postgres:15
    container_name: portfolioq_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolioq}
      POSTGRES_USER: ${POSTGRES_USER:-portfolioq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolioq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portfolioq_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: portfolioq_mlflow
    ports:
      - "5003:5003"
    environment:
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
      # Use same PostgreSQL as application (single database end-to-end)
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    # Official image lacks psycopg2; install at startup then run server (ports unchanged)
    command: ["bash", "-c", "pip install --quiet psycopg2-binary && exec python -m mlflow server --backend-store-uri \"$MLFLOW_BACKEND_STORE_URI\" --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5003"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5003/health')\" 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Celery metrics: workers push here; Prometheus scrapes this (API /metrics is separate).
  pushgateway:
    image: prom/pushgateway:latest
    container_name: portfolioq_pushgateway
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"

  prometheus:
    image: prom/prometheus:latest
    container_name: portfolioq_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - pushgateway
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: portfolioq_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-portfolioq_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MLFLOW_TRACKING_URI=http://mlflow:5003
      - MODEL_STORE=/app/ml_models
      - REPORTS_DIR=/app/reports
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    env_file:
      - .env

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_celery_worker
    command: celery -A src.tasks.celery_tasks worker --loglevel=info --concurrency=4 --uid=nobody
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5003
      - MODEL_STORE=/app/ml_models
      - REPORTS_DIR=/app/reports
      - PROMETHEUS_PUSHGATEWAY=pushgateway:9091
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
      - reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      pushgateway:
        condition: service_started
      backend:
        condition: service_started
    env_file:
      - .env

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolioq_celery_beat
    command: celery -A src.tasks.celery_tasks beat --loglevel=info --uid=nobody
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-portfolioq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolioq}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5003
      - MODEL_STORE=/app/ml_models
      - REPORTS_DIR=/app/reports
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  ml_models:
  reports:
